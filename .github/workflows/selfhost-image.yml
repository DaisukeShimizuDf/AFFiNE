name: Build Self-host Image

# Build a self-host AFFiNE Docker image from THIS fork (linux/amd64) and push it
# to the fork owner's GitHub Container Registry namespace, e.g.
#   ghcr.io/<owner>/affine:<image-tag>
#
# Railway runs on linux/amd64, so we only build that single platform to keep the
# build fast. Trigger manually from the Actions tab (workflow_dispatch).

on:
  workflow_dispatch:
    inputs:
      app-version:
        description: 'Version string baked into the build'
        required: true
        default: '0.26.3'
      image-tag:
        description: 'Docker tag to push under ghcr.io/<owner>/affine'
        required: true
        default: 'selfhost'

permissions:
  contents: read
  packages: write

jobs:
  build-image:
    name: Build & push (linux/amd64)
    # Build on ubuntu-22.04 (glibc 2.35) so the Rust native module stays compatible
    # with the Debian bookworm runtime image (glibc 2.36). ubuntu-latest (24.04,
    # glibc 2.39) produces a binary that requires GLIBC_2.38 and fails to dlopen.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Compute lowercase image repo
        id: repo
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/affine" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: ./.github/actions/setup-node
        with:
          electron-install: false

      - name: Setup Version
        uses: ./.github/actions/setup-version
        with:
          app-version: ${{ inputs.app-version }}

      # 1) Rust native module (amd64). The server bundle inlines this into dist,
      #    so it must exist and be named `server-native.x64.node` beforehand.
      #
      #    NOTE: we intentionally do NOT use ./.github/actions/build-rust here. That
      #    action restores a Swatinem/rust-cache keyed only by target+package (not by
      #    runner OS), so object files compiled on ubuntu-latest (glibc 2.39, emits
      #    __isoc23_* symbols) get reused on ubuntu-22.04 and poison the binary.
      #    Building cache-free guarantees a clean compile against this runner's glibc 2.35.
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.96.0'
          targets: x86_64-unknown-linux-gnu

      - name: Build server-native (x86_64, cache-free)
        run: yarn workspace @affine/server-native build --target x86_64-unknown-linux-gnu
        env:
          CC: clang -D_BSD_SOURCE
          TARGET_CC: clang -D_BSD_SOURCE
          DEBUG: 'napi:*'

      # The server bundle statically resolves `require('./server-native.<arch>.node')`
      # for x64, arm64 AND armv7. We only build x64 (Railway is amd64), so satisfy the
      # bundler with placeholder copies for the arches we don't ship. These are never
      # loaded at runtime on amd64, and docker-clean strips all non-amd64 .node files
      # from the final image, so the placeholders never reach production.
      - name: Prepare native binaries
        run: |
          cd packages/backend/native
          mv server-native.node server-native.x64.node
          cp server-native.x64.node server-native.arm64.node
          cp server-native.x64.node server-native.armv7.node
          ls -la server-native.*.node
          echo "=== glibc versions required by server-native.x64.node (must be <= 2.36 for bookworm) ==="
          objdump -T server-native.x64.node | grep -oE 'GLIBC_[0-9.]+' | sort -V -u | tail -n 5
          if objdump -T server-native.x64.node | grep -qE 'GLIBC_2\.3[7-9]|GLIBC_2\.[4-9][0-9]|__isoc23_'; then
            echo "ERROR: native binary requires glibc/symbols newer than bookworm (2.36)." >&2
            echo "Likely a poisoned rust cache or a build on ubuntu-latest. Offending symbols:" >&2
            objdump -T server-native.x64.node | grep -E 'GLIBC_2\.3[7-9]|GLIBC_2\.[4-9][0-9]|__isoc23_' >&2 || true
            exit 1
          fi

      # 2) Backend server bundle — this is where the memberLimit change is compiled in.
      - name: Build @affine/server
        run: |
          yarn workspace @affine/server build
          echo "=== server dist after build ==="
          ls -la packages/backend/server/dist
          test -f packages/backend/server/dist/main.js

      # 3) Frontend assets (no R2/Sentry/Captcha secrets required; those only enable
      #    optional sourcemap upload / captcha and are safe to omit for self-host).
      - name: Build @affine/web
        run: yarn affine @affine/web build
        env:
          BUILD_TYPE: stable
          NODE_OPTIONS: --max-old-space-size=8192
      - name: Build @affine/admin
        run: yarn affine @affine/admin build
        env:
          BUILD_TYPE: stable
          NODE_OPTIONS: --max-old-space-size=8192
      - name: Build @affine/mobile
        run: yarn affine @affine/mobile build
        env:
          BUILD_TYPE: stable
          NODE_OPTIONS: --max-old-space-size=8192

      # 4) Production-only node_modules + Prisma client, then move them next to the
      #    server (mirrors the official build-images.yml packaging step).
      #
      #    The `yarn workspaces focus --production` reinstall can disturb the freshly
      #    built server dist, so we stash it first and restore it right before the
      #    docker build (the official pipeline places dist *after* this focus step too).
      - name: Stash server dist
        run: |
          rm -rf /tmp/affine-server-dist
          mv packages/backend/server/dist /tmp/affine-server-dist

      - name: Install production dependencies
        run: |
          yarn config set --json supportedArchitectures.cpu '["x64"]'
          yarn config set --json supportedArchitectures.libc '["glibc"]'
          yarn workspaces focus @affine/server --production

      - name: Generate Prisma client
        run: yarn workspace @affine/server prisma generate

      - name: Move node_modules into server package
        run: mv ./node_modules ./packages/backend/server

      - name: Restore server dist
        run: |
          rm -rf packages/backend/server/dist
          mv /tmp/affine-server-dist packages/backend/server/dist
          echo "=== server dist before docker build ==="
          ls -la packages/backend/server/dist
          test -f packages/backend/server/dist/main.js

      # 5) Build & push the image using the official self-host Dockerfile.
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/deployment/node/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ steps.repo.outputs.image }}:${{ inputs.image-tag }}
            ${{ steps.repo.outputs.image }}:${{ inputs.app-version }}
            ${{ steps.repo.outputs.image }}:${{ steps.repo.outputs.sha }}
