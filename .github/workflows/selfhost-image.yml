name: Build Self-host Image

# Build a self-host AFFiNE Docker image from THIS fork (linux/amd64) and push it
# to the fork owner's GitHub Container Registry namespace, e.g.
#   ghcr.io/<owner>/affine:<image-tag>
#
# Railway runs on linux/amd64, so we only build that single platform to keep the
# build fast. Trigger manually from the Actions tab (workflow_dispatch).

on:
  workflow_dispatch:
    inputs:
      app-version:
        description: 'Version string baked into the build'
        required: true
        default: '0.26.3'
      image-tag:
        description: 'Docker tag to push under ghcr.io/<owner>/affine'
        required: true
        default: 'selfhost'

permissions:
  contents: read
  packages: write

jobs:
  build-image:
    name: Build & push (linux/amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Compute lowercase image repo
        id: repo
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/affine" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: ./.github/actions/setup-node
        with:
          electron-install: false

      - name: Setup Version
        uses: ./.github/actions/setup-version
        with:
          app-version: ${{ inputs.app-version }}

      # 1) Rust native module (amd64). The server bundle inlines this into dist,
      #    so it must exist and be named `server-native.x64.node` beforehand.
      - name: Build server-native (x86_64)
        uses: ./.github/actions/build-rust
        with:
          target: x86_64-unknown-linux-gnu
          package: '@affine/server-native'

      - name: Rename native binary
        run: mv ./packages/backend/native/server-native.node ./packages/backend/native/server-native.x64.node

      # 2) Backend server bundle — this is where the memberLimit change is compiled in.
      - name: Build @affine/server
        run: yarn workspace @affine/server build

      # 3) Frontend assets (no R2/Sentry/Captcha secrets required; those only enable
      #    optional sourcemap upload / captcha and are safe to omit for self-host).
      - name: Build @affine/web
        run: yarn affine @affine/web build
        env:
          BUILD_TYPE: stable
          NODE_OPTIONS: --max-old-space-size=8192
      - name: Build @affine/admin
        run: yarn affine @affine/admin build
        env:
          BUILD_TYPE: stable
          NODE_OPTIONS: --max-old-space-size=8192
      - name: Build @affine/mobile
        run: yarn affine @affine/mobile build
        env:
          BUILD_TYPE: stable
          NODE_OPTIONS: --max-old-space-size=8192

      # 4) Production-only node_modules + Prisma client, then move them next to the
      #    server (mirrors the official build-images.yml packaging step).
      - name: Install production dependencies
        run: |
          yarn config set --json supportedArchitectures.cpu '["x64"]'
          yarn config set --json supportedArchitectures.libc '["glibc"]'
          yarn workspaces focus @affine/server --production

      - name: Generate Prisma client
        run: yarn workspace @affine/server prisma generate

      - name: Move node_modules into server package
        run: mv ./node_modules ./packages/backend/server

      # 5) Build & push the image using the official self-host Dockerfile.
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/deployment/node/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ steps.repo.outputs.image }}:${{ inputs.image-tag }}
            ${{ steps.repo.outputs.image }}:${{ inputs.app-version }}
